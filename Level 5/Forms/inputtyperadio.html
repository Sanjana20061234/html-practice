<!-- this code is for if we click on the dot than only it will be clicked and if we want ki we click on the words of male female and the option will be cjhosen for that we will define (id) and for-->



<!DOCTYPE html>
<html lang="en">
<head>
    <title>Input type:Radio</title>
</head>
<body>
    <form>
        <label for="male">Male:</label>
        <input type="radio" name="gender" id="male" value="male"><br>
        <label for="female">Female:</label>
        <input type="radio" id="female" name="gender" value="female"><br>
        <label for="other">Other:</label>
        <input type="radio" id="other" name="gender" value="other"><br>
        
    </form>

    
</body>
</html>
