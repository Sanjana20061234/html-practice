<!DOCTYPE html>
<html lang="en">
<head>
    <title>Input type:Checkbox</title>
</head>
<body>
    <form>
        <label for="c">C:</label>
        <input type="checkbox" name="lang" id="C" value="C"><br>
        <label for="java">Java:</label>
        <input type="checkbox" id="java" name="lang" value="java"><br>
        <label for="c++">C++:</label>
        <input type="checkbox" id="c++" name="lang" value="c++"><br>
        
    </form>

    
</body>
</html>
