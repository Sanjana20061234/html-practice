<!DOCTYPE html>
<html lang="en">
<head>
    <title>Column Spans</title>
</head>
<body>
    <table border="1">
        <caption>Technologies</caption>
        <tr>
            <th colspan="3">Tech I am good at</th>
        </tr>
        <tr>
            <th>language</th>
            <th>Competency</th>
            <th>Years</th>
        </tr>
        <tr>
            <td>C</td>
            <td>7/10</td>
            <td>1 years</td>
        </tr>
        <tr>
            <td>Java</td>
            <td>4/10</td>
            <td>1 years</td>
        </tr>

    </table>
</body>
</html>
